name: pdf-service

services:
  api:
    build:
      context: .
    image: pdf-service:local
    command: ["node", "dist/api/server.js"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_LOCAL_DIR: /data/jobs
    ports:
      # The only port published to the host. In production this sits behind
      # Caddy or a Cloudflare Tunnel instead.
      - "8080:8080"
    volumes:
      - pdf_data:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    logging:
      driver: json-file
      options:
        # A load test can produce a lot of lines; cap what a container keeps.
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
    image: pdf-service:local
    command: ["node", "dist/worker/worker.js"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_LOCAL_DIR: /data/jobs
    volumes:
      # Shared with the API so the local storage driver can hand files over.
      - pdf_data:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    logging:
      driver: json-file
      options:
        # A load test can produce a lot of lines; cap what a container keeps.
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports: reachable only from the compose network.
    command:
      - redis-server
      - --appendonly
      - "yes"
      # A queue must never lose jobs to eviction.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        # A load test can produce a lot of lines; cap what a container keeps.
        max-size: "20m"
        max-file: "5"

  gotenberg:
    # Chromium-only image: no LibreOffice, since this service is HTML -> PDF.
    image: gotenberg/gotenberg:8.36-chromium
    restart: unless-stopped
    # No ports either. Only the worker talks to it, over the private network.
    command:
      - "gotenberg"
      - "--api-port=3000"
      # Slightly above RENDER_TIMEOUT_MS so our own timeout fires first.
      - "--api-timeout=45s"
      # Features we do not use are switched off rather than left exposed.
      - "--api-disable-download-from=true"
      - "--webhook-disable=true"
      # SSRF protection: Chromium may not fetch 127.0.0.0/8, RFC1918,
      # link-local or unique-local addresses while rendering.
      - "--chromium-deny-private-ips=true"
      # Must equal WORKER_CONCURRENCY. If this is lower, the surplus jobs queue
      # inside Gotenberg and that wait hides inside render_ms, which reads as a
      # slow renderer rather than a misconfiguration. 2 is the measured sweet
      # spot on a 4-core machine - see the benchmark log in PROGRESS.md.
      - "--chromium-max-concurrency=2"
      - "--chromium-max-queue-size=100"
      # Recycle Chromium periodically to bound memory growth. Note that a
      # restart lands on whichever render triggers it, so during a 100-job
      # benchmark it shows up as a couple of latency outliers; raise it (or use
      # 0) when you want a clean tail measurement.
      - "--chromium-restart-after=50"
      # Untested lever worth an A/B: Gotenberg starts a browser per conversion
      # by default, and this keeps one warm. Measure before adopting.
      # - "--chromium-auto-start=true"
      - "--gotenberg-hide-banner=true"
      - "--log-level=info"
      # Correlate Gotenberg's own log lines with our job ids, which the worker
      # sends as the Gotenberg-Trace header.
      - "--api-correlation-id-header=Gotenberg-Trace"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        # A load test can produce a lot of lines; cap what a container keeps.
        max-size: "20m"
        max-file: "5"
    # Uncomment on a small VPS to keep Chromium from taking the host down:
    # mem_limit: 1g

  # ---------------------------------------------------------------------------
  # Monitoring stack. Off by default; start it with:
  #   docker compose --profile monitoring up -d
  # Nothing here is required by the service - it exists to size the machine.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      # Bound to localhost: reach it over an SSH tunnel
      #   ssh -L 3001:localhost:3001 user@vps
      - "127.0.0.1:3001:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Host CPU (including steal), memory, disk and network.
  node-exporter:
    image: prom/node-exporter:v1.9.0
    profiles: ["monitoring"]
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($$|/)"
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Per-container CPU and memory - this is how you watch Chromium's footprint.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pdf_data:
  redis_data:
  prometheus_data:
  grafana_data:
