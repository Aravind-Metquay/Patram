name: pdf-service

services:
  api:
    build:
      context: .
    image: pdf-service:local
    command: ["node", "dist/api/server.js"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_LOCAL_DIR: /data/jobs
    ports:
      # The only port published to the host. In production this sits behind
      # Caddy or a Cloudflare Tunnel instead.
      - "8080:8080"
    volumes:
      - pdf_data:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
    image: pdf-service:local
    command: ["node", "dist/worker/worker.js"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      GOTENBERG_URL: http://gotenberg:3000
      STORAGE_LOCAL_DIR: /data/jobs
    volumes:
      # Shared with the API so the local storage driver can hand files over.
      - pdf_data:/data/jobs
    depends_on:
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports: reachable only from the compose network.
    command:
      - redis-server
      - --appendonly
      - "yes"
      # A queue must never lose jobs to eviction.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gotenberg:
    # Chromium-only image: no LibreOffice, since this service is HTML -> PDF.
    image: gotenberg/gotenberg:8.36-chromium
    restart: unless-stopped
    # No ports either. Only the worker talks to it, over the private network.
    command:
      - "gotenberg"
      - "--api-port=3000"
      # Slightly above RENDER_TIMEOUT_MS so our own timeout fires first.
      - "--api-timeout=45s"
      # Features we do not use are switched off rather than left exposed.
      - "--api-disable-download-from=true"
      - "--webhook-disable=true"
      # SSRF protection: Chromium may not fetch 127.0.0.0/8, RFC1918,
      # link-local or unique-local addresses while rendering.
      - "--chromium-deny-private-ips=true"
      # One render at a time; BullMQ is what queues the rest.
      - "--chromium-max-concurrency=1"
      - "--chromium-max-queue-size=100"
      # Recycle Chromium periodically to bound memory growth.
      - "--chromium-restart-after=50"
      - "--gotenberg-hide-banner=true"
      - "--log-level=info"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Uncomment on a small VPS to keep Chromium from taking the host down:
    # mem_limit: 1g

volumes:
  pdf_data:
  redis_data:
